<!DOCTYPE html>
<html>
<head>
    <title>Pesanan - MealQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Pesanan Kamu 🍽️</h1>

    <div id="order-box"></div>

    <button onclick="hapusPesanan()">Hapus Pesanan</button>
    <br><br>
    <a href="home.html"><button>Kembali ke Home</button></a>
</div>

<script>
const box = document.getElementById("order-box");

const pesanan = localStorage.getItem("pesanan");

if (!pesanan) {
    box.innerHTML = "<p>Belum ada pesanan 😢</p>";
} else {
    box.innerHTML = `
        <div class="order-item">
            <h2>${pesanan}</h2>
            <p>Pesanan berhasil dibuat ✅</p>
        </div>
    `;
}

function hapusPesanan() {
    localStorage.removeItem("pesanan");
    location.reload();
}
</script>

</body>
</html>
