//home.html untuk tampilan awal berbagai kedai pilihan
<!DOCTYPE html>
<html>
<head>
    <title>Home - MealQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1 id="welcome"></h1>

    <h2>Pilih Kedai 🍽️</h2>

    <div class="kedai">
        <button onclick="pilihKedai('Kedai Joni')">🍛 Kedai Joni</button>
        <button onclick="pilihKedai('Kedai Kosim')">🍜 Kedai Kosim</button>
        <button onclick="pilihKedai('Kedai Maranggi')">🍢 Kedai Maranggi</button>
        <button onclick="pilihKedai('Kedai Japar')">🍲 Kedai Japar</button>
    </div>
</div>

<script>
const user = localStorage.getItem("user");

// kalau belum login
if(!user){
    window.location.href = "index.html";
}

document.getElementById("welcome").innerText = "Halo, " + user + "! 👋";

function pilihKedai(nama) {
    localStorage.setItem("kedai", nama);
    window.location.href = "menu.html";
}
</script>

</body>
</html>
